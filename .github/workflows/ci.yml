name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build:pages
      - name: Check generated files
        run: |
          git diff --check
          git diff --exit-code
      - name: Test the installed package
        run: |
          release_directory="$RUNNER_TEMP/for-humanity-release"
          mkdir -p "$release_directory"
          npm pack --ignore-scripts --json --pack-destination "$release_directory" > "$release_directory/pack.json"
          node util/smoke-package.mjs "$release_directory"
