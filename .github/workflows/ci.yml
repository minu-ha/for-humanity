name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22.12.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - id: build
        run: pnpm build:pages
      - id: browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check browser diagrams, navigation and development
        run: pnpm exec playwright test
      - name: Check generated files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          git diff --check
          git diff --exit-code
      - name: Test the installed package
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: |
          release_directory="$RUNNER_TEMP/for-humanity-release"
          mkdir -p "$release_directory"
          npm pack --ignore-scripts --json --pack-destination "$release_directory" > "$release_directory/pack.json"
          if ! pnpm exec tsx util/smoke-package.ts "$release_directory" 2>&1 | tee "$release_directory/smoke.log"; then
            node --input-type=module - "$release_directory/smoke.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const output = readFileSync(process.argv[2], 'utf8').slice(-16000)
            .replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.log(`::error title=Installed package verification::${output}`);
          NODE
            exit 1
          fi
